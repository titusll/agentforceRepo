<template>
    <lightning-card>
        <h2>Search</h2>
        <lightning-input type="text" minlength="5" onchange={handleSearch} value={userSearch}>
        </lightning-input>
        <template for:each={listResults} for:item="song">
                    <div key={song} class="slds-m-bottom_x-small">
                        {song}
                    </div>
                </template>
    </lightning-card>
</template>
